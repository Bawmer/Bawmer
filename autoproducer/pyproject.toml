[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoproducer"
version = "0.1.0"
description = "Compose, arrange, mix and export a finished song in Ableton Live 12 via AbletonOSC, using only your own samples and whitelisted VST3 plugins."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "librosa>=0.10",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
  "python-osc>=1.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = ["pyautogui>=0.9.54", "pygetwindow>=0.0.9; sys_platform == 'win32'"]
dev = ["pytest>=7"]

[project.scripts]
autoproducer = "autoproducer.cli:main"

[tool.setuptools]
packages = ["autoproducer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
