name: Lumen MC-64 (mastering compressor)

on:
  push:
    paths: [ "mastering-compressor/**", ".github/workflows/mastering-compressor.yml" ]
  pull_request:
    paths: [ "mastering-compressor/**", ".github/workflows/mastering-compressor.yml" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-14, windows-2022 ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mastering-compressor
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev libxcomposite-dev

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" == "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: LumenMC64-${{ runner.os }}
          path: |
            mastering-compressor/build/LumenMC64_artefacts/Release/VST3
            mastering-compressor/build/LumenMC64_artefacts/Release/AU
            mastering-compressor/build/LumenMC64_artefacts/Release/Standalone
          if-no-files-found: warn
