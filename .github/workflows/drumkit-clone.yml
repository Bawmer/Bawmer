name: Drumkit Clone

on:
  push:
    paths:
      - "drumkit-clone/**"
      - ".github/workflows/drumkit-clone.yml"
  pull_request:
    paths:
      - "drumkit-clone/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: drumkit-clone
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev xvfb

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Self-test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./build/DrumkitCloneTests_artefacts/Release/DrumkitCloneTests
          else
            ./build/DrumkitCloneTests_artefacts/Release/DrumkitCloneTests
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Drumkit Clone VST3 (${{ matrix.name }})
          path: drumkit-clone/build/DrumkitClone_artefacts/Release/VST3
          if-no-files-found: error
