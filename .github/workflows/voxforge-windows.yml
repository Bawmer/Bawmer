name: VoxForge (Windows x64 VST3)

on:
  push:
    paths:
      - "VoxForge/**"
      - ".github/workflows/voxforge-windows.yml"
  pull_request:
    paths:
      - "VoxForge/**"
  workflow_dispatch:

jobs:
  engine:
    name: Neural engine (base model fine-tune smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine (CPU PyTorch)
        run: |
          pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install ./VoxForge/engine
      - name: Synthetic training material
        run: python VoxForge/engine/tests/make_synthetic_singing.py data
      - name: Download the pretrained RVC v2 48 kHz base model
        run: voxforge-engine download-base --models-dir models
      - name: Fine-tune from the base model (short) and export voice.onnx
        run: voxforge-engine train --voice-dir work --models-dir models --samples data/take0.wav data/take1.wav data/take2.wav --epochs 2 --quality fast --max-steps-per-epoch 3 --no-download
      - name: Run the exported models with onnxruntime
        run: python VoxForge/engine/tests/check_onnx.py models/content_encoder.onnx work/voice.onnx data/take0.wav converted.wav
      - name: Import Applio / RVC v2 models (48 kHz trained + 40 kHz)
        run: |
          python VoxForge/engine/tests/make_applio_models.py work/checkpoints/latest.pt .
          voxforge-engine import-model --model applio48k.pth --out imported/applio48k.onnx
          voxforge-engine import-model --model applio40k.pth --out imported/applio40k.onnx
          ls -la imported
      - name: Voicebox - train a neural voice from a Voicebox profile (mock Voicebox API)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          python VoxForge/engine/tests/mock_voicebox.py --port 17493 > mock_voicebox.log 2>&1 &
          sleep 2
          voxforge-engine voicebox-profiles | tee vbprofiles.jsonl
          grep -q '"Test Voice"' vbprofiles.jsonl
          voxforge-engine train --voice-dir vbwork --models-dir models --voicebox-profile "test voice" --voicebox-minutes 0.5 --epochs 1 --quality fast --max-steps-per-epoch 2 --no-download | tee vbtrain.jsonl
          grep -q '"type": "result"' vbtrain.jsonl
          ls -la vbwork/samples/voicebox vbwork/voice.onnx
          cat mock_voicebox.log | head -5
      - name: Lyrics extraction - recording with known words (espeak-ng) through the engine
        run: |
          espeak-ng -s 120 -w lyrics.wav "twinkle twinkle little star how I wonder what you are"
          voxforge-engine transcribe --audio lyrics.wav --language en --model small --models-dir models | tee transcribe.jsonl
          grep -q '"type": "result"' transcribe.jsonl
      - name: Lyrics extraction - plug-in C++ path (StemAnalyzer -> engine -> words on notes)
        run: |
          sudo apt-get install -y -qq pkg-config libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev mesa-common-dev ninja-build
          # setup-python overrides PKG_CONFIG_PATH; JUCE finds freetype/alsa through pkg-config
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/usr/lib/pkgconfig"
          export CPATH="/usr/include/freetype2${CPATH:+:$CPATH}"
          echo "freetype: $(pkg-config --cflags --libs freetype2)"; ls /usr/include/freetype2 | head -3
          cmake -S VoxForge -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DVOXFORGE_BUILD_TESTS=ON -DVOXFORGE_STANDALONE=OFF
          cmake --build build-linux --target VoxForgeTests -j4
          export VOXFORGE_ENGINE_COMMAND="$(which voxforge-engine)"
          export VF_LYRICS_STEM="$PWD/lyrics.wav"
          export VF_LYRICS_EXPECT="twinkle little star wonder what"
          python VoxForge/engine/tests/mock_voicebox.py --port 17494 > mock_voicebox_cpp.log 2>&1 &
          sleep 2
          export VF_VOICEBOX_URL="http://127.0.0.1:17494"
          export VOXFORGE_DATA_DIR="$PWD/vfdata-linux"
          ./build-linux/VoxForgeTests_artefacts/Release/VoxForgeTests test-output-linux
      - uses: actions/upload-artifact@v4
        with:
          name: voxforge-test-models
          path: |
            models/content_encoder.onnx
            work/voice.onnx
            imported/applio40k.onnx
            converted.wav
            lyrics.wav
            transcribe.jsonl
          retention-days: 7

  engine-torch27:
    # RTX 50 series (Blackwell) users get PyTorch 2.7.1 (CUDA 12.8) from install_engine.ps1:
    # check the engine end to end with that PyTorch version (CPU build here, no GPU on the runner)
    name: Neural engine on PyTorch 2.7.1 (RTX 50 series build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine with PyTorch 2.7.1
        run: |
          pip install torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install ./VoxForge/engine
          voxforge-engine check --models-dir models
      - name: Fine-tune, export, run with onnxruntime, import an Applio model
        run: |
          python VoxForge/engine/tests/make_synthetic_singing.py data
          voxforge-engine download-base --models-dir models
          voxforge-engine train --voice-dir work --models-dir models --samples data/take0.wav data/take1.wav --epochs 1 --quality fast --max-steps-per-epoch 2 --no-download
          python VoxForge/engine/tests/check_onnx.py models/content_encoder.onnx work/voice.onnx data/take0.wav converted.wav
          python VoxForge/engine/tests/make_applio_models.py work/checkpoints/latest.pt .
          voxforge-engine import-model --model applio40k.pth --out imported/applio40k.onnx

  build:
    needs: engine
    # still build and test the plug-in if the engine job failed (e.g. a model host is down);
    # the run stays red, but the plug-in artifact is produced
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    env:
      ORT_VERSION: "1.20.1"
      DML_VERSION: "1.15.2"
    steps:
      - uses: actions/checkout@v4

      - name: Download ONNX Runtime with DirectML (GPU) - official NuGet packages
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/$env:ORT_VERSION" -OutFile ort.zip
          Expand-Archive ort.zip -DestinationPath ort
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/$env:DML_VERSION" -OutFile dml.zip
          Expand-Archive dml.zip -DestinationPath dml
          Copy-Item dml\bin\x64-win\DirectML.dll ort\runtimes\win-x64\native\
          Get-ChildItem ort\build\native\include, ort\runtimes\win-x64\native | Select-Object -ExpandProperty FullName
          "ORT_ROOT=$pwd\ort" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: >
          cmake -S VoxForge -B build -G "Visual Studio 17 2022" -A x64
          -DVOXFORGE_WITH_ONNX=ON -DONNXRUNTIME_ROOT="$env:ORT_ROOT" -DVOXFORGE_BUILD_TESTS=ON

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Get the trained test models
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: voxforge-test-models
          path: test-models

      - name: Engine tests (incl. neural voice through the C++ ONNX backend)
        shell: pwsh
        run: |
          if ((Test-Path test-models\models\content_encoder.onnx) -and (Test-Path test-models\work\voice.onnx)) {
            $env:VF_CONTENT_ENCODER = (Resolve-Path test-models\models\content_encoder.onnx).Path
            $env:VF_VOICE_MODEL = (Resolve-Path test-models\work\voice.onnx).Path
          } else { Write-Warning "No trained test models (engine job failed) - neural test [9] skipped" }
          Copy-Item "$env:ORT_ROOT\runtimes\win-x64\native\*.dll" build\VoxForgeTests_artefacts\Release\
          if (Test-Path test-models\lyrics.wav) {
            # stand-in for the Voicebox app: answers with the espeak recording of the test lyrics
            Start-Process python -ArgumentList "VoxForge\engine\tests\mock_voicebox.py","--port","17493","--wav","test-models\lyrics.wav" -NoNewWindow
            Start-Sleep -Seconds 3
            $env:VF_VOICEBOX_URL = "http://127.0.0.1:17493"
          }
          $env:VOXFORGE_DATA_DIR = "$pwd\vfdata48"
          $env:VF_TEST_GPU = "software"     # no GPU on the runner: DirectML on the software adapter
          & build\VoxForgeTests_artefacts\Release\VoxForgeTests.exe build\test-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path test-models\imported\applio40k.onnx) {
            Write-Host "--- imported Applio/RVC 40 kHz model through the plug-in backend ---"
            $env:VF_VOICE_MODEL = (Resolve-Path test-models\imported\applio40k.onnx).Path
            $env:VF_VOICE_RATE = "40000"; $env:VF_VOICE_HOP = "800"
            $env:VOXFORGE_DATA_DIR = "$pwd\vfdata40"
            $env:VF_TEST_GPU = ""
            & build\VoxForgeTests_artefacts\Release\VoxForgeTests.exe build\test-output-40k
            exit $LASTEXITCODE
          }

      - name: Host smoke test (loads the .vst3 like a DAW)
        shell: pwsh
        run: |
          & build\VoxForgeHostTest_artefacts\Release\VoxForgeHostTest.exe build\VoxForge_artefacts\Release\VST3\VoxForge.vst3
          "exit code: $LASTEXITCODE"
          exit $LASTEXITCODE

      - name: Diagnostics - crash stack under cdb (only if the host test failed)
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cdb) { $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Where-Object FullName -match "x64" | Select-Object -First 1 }
          if (-not $cdb) { "cdb not found"; exit 0 }
          $vst = Resolve-Path build\VoxForge_artefacts\Release\VST3\VoxForge.vst3
          $sym = "$((Resolve-Path build\VoxForge_artefacts\Release\VST3).Path);$((Resolve-Path build\VoxForge_artefacts\Release\VST3\VoxForge.vst3\Contents\x86_64-win).Path);$((Resolve-Path build\VoxForgeHostTest_artefacts\Release).Path)"
          & $cdb.FullName -g -G -y $sym -c ".lines -e; .ecxr; kn 40; r; q" build\VoxForgeHostTest_artefacts\Release\VoxForgeHostTest.exe $vst
          Get-ChildItem -Recurse build\VoxForge_artefacts\Release -Filter *.pdb | Select-Object FullName

      - name: Assemble package
        shell: pwsh
        run: |
          $pkg = "package\VoxForge-win-x64"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item -Recurse build\VoxForge_artefacts\Release\VST3\VoxForge.vst3 $pkg
          Copy-Item build\VoxForge_artefacts\Release\Standalone\VoxForge.exe $pkg
          Copy-Item "$env:ORT_ROOT\runtimes\win-x64\native\*.dll" $pkg
          Copy-Item -Recurse VoxForge\engine "$pkg\engine"
          Copy-Item VoxForge\scripts\install_engine.ps1 $pkg
          Copy-Item VoxForge\docs\USER_MANUAL.md $pkg
          if (Test-Path build\test-output) { Copy-Item -Recurse build\test-output "$pkg\test-renders" }

      - uses: actions/upload-artifact@v4
        with:
          name: VoxForge-win-x64
          path: package/VoxForge-win-x64
          retention-days: 30
